[project]
name = "field-evidence-platform"
version = "0.1.0"
description = "Incident evidence marketplace backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
]

[project.optional-dependencies]
db = [
  "sqlalchemy",
  "alembic",
  "psycopg[binary]",
  "geoalchemy2",
]
dev = [
  "pytest",
  "httpx",
  "ruff",
  "mypy",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]